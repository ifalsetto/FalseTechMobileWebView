name: LockText v1.1 Jess Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: locktext

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "platform-tools" \
            "emulator" \
            "system-images;android-33;google_apis;x86_64"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify build inputs
        run: |
          java -version
          gradle --version
          test -f app/src/main/AndroidManifest.xml
          ! grep -R "android.permission.INTERNET" app/src/main
          grep -q "versionName '1.1.0-jess'" app/build.gradle
          grep -q "GRANT_MS = 5000L" app/src/main/java/com/falsetech/locktext/Store.java
          grep -q "BIND_NOTIFICATION_LISTENER_SERVICE" app/src/main/AndroidManifest.xml
          grep -q "TYPE_ACCESSIBILITY_OVERLAY" app/src/main/java/com/falsetech/locktext/LockAccessibilityService.java

      - name: Clean lint and compile APK
        run: gradle --no-daemon --stacktrace clean lintDebug assembleDebug

      - name: Verify signed APK and permissions
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "app/build/outputs/apk/debug/LockText-v1.1-Jess.apk"
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose "app/build/outputs/apk/debug/LockText-v1.1-Jess.apk"
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump badging "app/build/outputs/apk/debug/LockText-v1.1-Jess.apk" | head -20
          "$ANDROID_HOME/build-tools/33.0.2/aapt" dump permissions "app/build/outputs/apk/debug/LockText-v1.1-Jess.apk" | tee /tmp/locktext-permissions.txt
          ! grep -q "android.permission.INTERNET" /tmp/locktext-permissions.txt
          sha256sum "app/build/outputs/apk/debug/LockText-v1.1-Jess.apk"

      - name: Install and launch runtime smoke test
        timeout-minutes: 6
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/LockText-v1.1-Jess.apk"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

          echo "no" | avdmanager create avd \
            --force \
            --name locktext-ci \
            --package "system-images;android-33;google_apis;x86_64" \
            --device "pixel_5"

          "$ANDROID_HOME/emulator/emulator" -list-avds | tee /tmp/locktext-avds.txt
          grep -qx "locktext-ci" /tmp/locktext-avds.txt

          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd locktext-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -cores 2 \
            -memory 2048 \
            >/tmp/locktext-emulator.log 2>&1 &
          EMULATOR_PID=$!

          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          if ! timeout 120 adb wait-for-device; then
            echo "ADB did not see the emulator"
            cat /tmp/locktext-emulator.log || true
            exit 1
          fi

          if ! timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'; then
            echo "Android emulator did not finish booting"
            cat /tmp/locktext-emulator.log || true
            adb shell getprop || true
            exit 1
          fi

          adb shell input keyevent 82 || true
          adb install -r "$APK"
          adb logcat -c
          adb shell am start -W -n com.falsetech.locktext/.MainActivity | tee /tmp/locktext-start.txt
          grep -q "Status: ok" /tmp/locktext-start.txt
          sleep 5

          PID="$(adb shell pidof com.falsetech.locktext | tr -d '\r')"
          test -n "$PID"
          adb shell dumpsys activity activities | grep -E "com\.falsetech\.locktext(/|\.)com\.falsetech\.locktext\.MainActivity|com\.falsetech\.locktext/.MainActivity|com\.falsetech\.locktext\.MainActivity"

          if adb logcat -d --pid="$PID" | grep -q "FATAL EXCEPTION"; then
            echo "LockText crashed during launch smoke test"
            adb logcat -d --pid="$PID"
            exit 1
          fi

          adb shell am force-stop com.falsetech.locktext
          adb uninstall com.falsetech.locktext
          echo "RUNTIME_SMOKE_TEST=PASS"

      - name: Upload deployable APK
        uses: actions/upload-artifact@v4
        with:
          name: LockText-v1.1-Jess
          path: locktext/app/build/outputs/apk/debug/LockText-v1.1-Jess.apk
          if-no-files-found: error
          retention-days: 7
