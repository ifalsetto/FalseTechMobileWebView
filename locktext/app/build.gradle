plugins {
    id 'com.android.application'
}

android {
    namespace 'com.falsetech.locktext'
    compileSdk 33
    buildToolsVersion '33.0.2'

    defaultConfig {
        applicationId 'com.falsetech.locktext'
        minSdk 28
        targetSdk 33
        versionCode 11
        versionName '1.1.0-jess'
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
